spring:
  datasource:
    url: jdbc:h2:mem:loan_system_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: test-secret-key-for-jwt-signing-only-used-in-tests-32chars-min
    expiration-ms: 3600000
